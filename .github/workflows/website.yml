# Keeps gazeora.github.io in step when a release is edited, unpublished or deleted. A newly
# published release reaches it from ci.yml, after its APK is attached.
name: Website

on:
  release:
    types: [edited, unpublished, deleted]

permissions:
  contents: read

jobs:
  update:
    name: Update the website
    runs-on: ubuntu-latest
    steps:
      - uses: Gazeora/gazeora.github.io/.github/actions/publish-release@main
        with:
          platform: android
          site-token: ${{ secrets.GAZEORA_SITE_TOKEN }}
