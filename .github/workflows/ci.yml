# Tests the app and builds its debug APK. A published GitHub release also gets a signed
# Gazeora-v<version>.apk attached, and then gazeora.github.io is told about it.
# weekly-release.yml calls this with a tag it made: that tag is built, and released as a
# pre-release with its APK.
name: CI

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The pre-release's tag, already pushed
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with app/build.gradle.kts
  SDK_PACKAGES: "platforms;android-37.0 build-tools;36.0.0 ndk;30.0.16248370 cmake;4.1.2"

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}  # empty: the event's own

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "25"  # the Gradle daemon's JDK (gradle/gradle-daemon-jvm.properties)

      - name: Install the Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $SDK_PACKAGES > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - name: License headers
        run: python3 tools/license_headers.py

      - name: Java unit tests
        run: ./gradlew testDebugUnitTest

      - name: Native protocol, hand geometry and head orientation tests
        run: |
          cmake -S app/src/test/cpp -B build/host-tests
          cmake --build build/host-tests --parallel
          build/host-tests/protocols_test
          build/host-tests/hands_test
          build/host-tests/head_test

      - name: Build the debug APK
        run: ./gradlew assembleDebug -Pgazeora.streamOverlay=false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gazeora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach the APK to the release
    if: github.event_name == 'release' || inputs.tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}  # empty: the event's own

      - name: Check the tag matches VERSION
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match VERSION ($expected)"
            exit 1
          fi

      - name: Check release candidates are pre-releases
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$TAG" in
            *-rc.*) wanted=true ;;
            *) wanted=false ;;
          esac
          if [ "$PRERELEASE" != "$wanted" ]; then
            echo "::error::$TAG must be published with pre-release set to $wanted"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $SDK_PACKAGES > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      # The keystore never enters the repository: it comes base64-encoded from a secret
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GAZEORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing key: add the GAZEORA_KEYSTORE_BASE64, GAZEORA_KEYSTORE_PASSWORD, GAZEORA_KEY_ALIAS and GAZEORA_KEY_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        env:
          GAZEORA_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          GAZEORA_KEYSTORE_PASSWORD: ${{ secrets.GAZEORA_KEYSTORE_PASSWORD }}
          GAZEORA_KEY_ALIAS: ${{ secrets.GAZEORA_KEY_ALIAS }}
          GAZEORA_KEY_PASSWORD: ${{ secrets.GAZEORA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pgazeora.streamOverlay=false

      - name: Check the signature and name the APK
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Gazeora-$TAG.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/Gazeora-$TAG.apk" | head -3

      - name: Upload to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"

      # Notes from the pull requests merged since the last release
      - name: Publish the weekly pre-release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "Gazeora $TAG" --generate-notes

      # Once the APK is attached, so the website lists it with the release
      - name: Tell the website
        uses: Gazeora/gazeora.github.io/.github/actions/publish-release@main
        with:
          platform: android
          site-token: ${{ secrets.GAZEORA_SITE_TOKEN }}
          tag: ${{ inputs.tag || github.event.release.tag_name }}
